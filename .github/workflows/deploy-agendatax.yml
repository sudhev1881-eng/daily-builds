name: Deploy AgendaTax

on:
  push:
    branches: [main, cursor/daily-project-generation-process-8538]
    paths:
      - "agendatax/**"
      - ".github/workflows/deploy-agendatax.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-agendatax
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agendatax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agendatax/package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: Build static site
        run: |
          node <<'NODE'
          import { execSync } from "node:child_process";
          import { existsSync, renameSync, rmSync, writeFileSync } from "node:fs";
          const api = "src/app/api";
          const stash = ".api-stash";
          if (existsSync(stash)) rmSync(stash, { recursive: true, force: true });
          if (existsSync(api)) renameSync(api, stash);
          try {
            execSync("npx next build", {
              stdio: "inherit",
              env: {
                ...process.env,
                NEXT_PUBLIC_STATIC_EXPORT: "1",
                NEXT_PUBLIC_BASE_PATH: "",
                NEXT_PUBLIC_ASSET_PREFIX: ".",
                NEXT_PUBLIC_APP_URL:
                  "https://sudhev1881-eng.github.io/daily-builds",
              },
            });
            writeFileSync("out/.nojekyll", "");
          } finally {
            if (existsSync(stash)) {
              if (existsSync(api)) rmSync(api, { recursive: true, force: true });
              renameSync(stash, api);
            }
          }
          NODE
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: agendatax/out
          force_orphan: true
          enable_jekyll: false
