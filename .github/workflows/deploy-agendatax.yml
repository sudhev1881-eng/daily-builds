name: Deploy AgendaTax

on:
  push:
    branches: [main, cursor/daily-project-generation-process-8538]
    paths:
      - "agendatax/**"
      - ".github/workflows/deploy-agendatax.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-agendatax
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agendatax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agendatax/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build:static
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /daily-builds
          NEXT_PUBLIC_APP_URL: https://sudhev1881-eng.github.io/daily-builds
      - uses: actions/upload-pages-artifact@v3
        with:
          path: agendatax/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
